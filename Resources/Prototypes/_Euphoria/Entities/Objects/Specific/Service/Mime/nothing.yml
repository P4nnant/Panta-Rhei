# nothing (the shield)
- type: entity
  name: nothing
  parent: BaseShield
  id: NothingShield
  description: A small round nothing shield.
  suffix: Shield
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Shields/buckler.rsi
    state: icon
    #state: buckler-icon
  - type: Item
    sprite: _Euphoria/Objects/Shields/buckler.rsi
    size: Ginormous
    #heldPrefix: buckler
  - type: Clothing
    sprite: _Euphoria/Objects/Shields/buckler.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 1
    activeBlockModifier:
      coefficients:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 1
  - type: Construction
    graph: WoodenBuckler
    node: woodenBuckler
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          IngotNothing1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: StaticPrice
    price: 150

# nothing (the wall)

- type: entity
  parent: BaseWall
  id: WallNothing
  name: nothing
  description: Keeps the nothing in and nothing out. Somehow airtight.
  suffix: Wall
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Structures/Walls/nothing.rsi
  - type: WallReplacementMarker
  #- type: Construction
  #  graph: Girder
  #  node: wall
  - type: Icon
    sprite: _Euphoria/Objects/Structures/Walls/nothing.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
        - !type:SpawnEntitiesBehavior
          spawn:
            IngotNothing1:
              min: 1
              max: 1
  - type: IconSmooth
    key: walls
    base: solid

# nothing (the bed)
- type: entity
  name: nothing
  id: BedNothing
  parent: BaseStructure
  description: This is used for nothing. Resting here provides nothing.
  suffix: Bed
  components:
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.1
        Blunt: -0.1
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
  - type: Sprite
    sprite: _Euphoria/Structures/Furniture/Beds/nothing.rsi
    state: bed
    noRot: true
  - type: Strap
    position: Down
    rotation: -90
  # Construction has to be before PlaceableSurface or you'll place things onto the entity instead of deconstructing it.
  - type: Construction
    graph: bed
    node: bed
  # So that you can put bedsheets on beds again. Would be cool to have a tag
  # for this so that only bedsheets can be placed.
  - type: PlaceableSurface
    placeCentered: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          IngotNothing1:
            min: 1
            max: 1
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Pullable
