# nothing (the shield)
- type: entity
  name: nothing
  parent: BaseShield
  id: NothingShield
  description: A small round nothing shield.
  suffix: Shield
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Shields/buckler.rsi
    state: icon
    #state: buckler-icon
  - type: Item
    sprite: _Euphoria/Objects/Shields/buckler.rsi
    size: Ginormous
    #heldPrefix: buckler
  - type: Clothing
    sprite: _Euphoria/Objects/Shields/buckler.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 1
    activeBlockModifier:
      coefficients:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
