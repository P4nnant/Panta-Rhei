# nothing (the bed)
- type: entity
  name: nothing
  id: BedNothing
  parent: BaseStructure
  description: This is used for nothing. Resting here provides nothing.
  suffix: Bed
  components:
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.1
        Blunt: -0.1
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
  - type: Sprite
    sprite: _Euphoria/Structures/Furniture/Beds/nothing.rsi
    state: bed
    noRot: true
  - type: Strap
    position: Down
    rotation: -90
  - type: Construction
    graph: NothingStructures
    node: BedNothing
  # Construction has to be before PlaceableSurface or you'll place things onto the entity instead of deconstructing it.
  # So that you can put bedsheets on beds again. Would be cool to have a tag
  # for this so that only bedsheets can be placed.
  - type: PlaceableSurface
    placeCentered: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          IngotNothing1:
            min: 1
            max: 1
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Pullable

# nothing (the door)
