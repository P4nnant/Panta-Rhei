# nothing (the revolver)
## toy
- type: entity
  parent: [ BaseItem, BaseToyGun ]
  id: RevolverNothing
  name: nothing
  description: Looks nothing like the real thing! Ages 8 and up.
  suffix: Capgun
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Fun/nothing_capgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: -2,-7
    sprite: _Euphoria/Objects/Fun/nothing_capgun.rsi
  - type: Tag
    tags:
    - Nothing
    - Sidearm
    - ToySidearm
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
      params:
        volume: 2.25
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - CartridgeNothing
      - SpeedLoaderNothing
    proto: CartridgeNothing
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: Construction
    graph: NothingObjects
    node: RevolverNothing

## uplink
- type: entity
  parent: RevolverNothing
