# base berry produce
- type: entity
  abstract: true
  parent: FoodProduceBase
  id: FoodProduceBaseBerry
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 11
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Vitamin
          Quantity: 4
  - type: Item
    heldPrefix: produce
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: blackberry
  parent: FoodProduceBaseBerry
  id: FoodBlackberry
  description: These berries have a deep sweetness and refreshing tartness to them.
  components:
  - type: FlavorProfile
    flavors:
    - blackberry
  - type: Sprite
    sprite: _Euphoria/Objects/Specific/Hydroponics/blackberry.rsi
  - type: Produce
    seedId: blackberry
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: BlackberryJuice
        Quantity: 10
  - type: FoodSequenceElement
    entries:
      Burger: Blackberry
      Taco: Blackberry
      Skewer: Blackberry
      Hotdog: Blackberry

- type: entity
  name: blueberry
  parent: FoodProduceBaseBerry
  id: FoodBlueberry
