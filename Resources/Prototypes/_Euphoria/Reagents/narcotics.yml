- type: reagent
  id: AphrodesiacVenom
  name: reagent-name-aphro-venom
  group: Narcotics
  desc: reagent-desc-aphro-venom
  physicalDesc: reagent-physical-desc-milky
  flavor: spooky
  color: "#c90084"
  metabolisms:
    Bloodstream:
      metabolismRate : 0.03
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Medium
        probability: 0.10
        messages:
        - reagent-effect-aphrodisiac-strong1
        - reagent-effect-aphrodisiac-strong2
        - reagent-effect-aphrodisiac-strong3
        conditions:
        - !type:ReagentCondition
          reagent: AphrodesiacVenom
          max: 10.0
        - !type:ConsentCondition
          consent: Aphrodisiacs
      - !type:PopupMessage
        type: Local
        visualType: LargeCaution
        probability: 0.2
        messages:
        - reagent-effect-aphrodisiac-strongoverdose1
        - reagent-effect-aphrodisiac-strongoverdose2
        - reagent-effect-aphrodisiac-strongoverdose3
        - reagent-effect-aphrodisiac-strongoverdose4
        conditions:
        - !type:ReagentCondition
          reagent: AphrodesiacVenom
          min: 10.0
        - !type:ConsentCondition
          consent: Aphrodisiacs
      - !type:PopupMessage
        type: Local
        visualType: Small
        probability: 0.2
        messages:
          - "reagent-effect-aphrodisiac-fade"
        conditions:
          - !type:ReagentCondition
            reagent: AphrodesiacVenom
            max: 0.1
          - !type:ConsentCondition
            consent: Aphrodisiacs

- type: reagent
  id: Romantacilin
  name: reagent-name-romantacilin
  group: Narcotics
  desc: reagent-desc-romantacilin
  physicalDesc: reagent-physical-desc-smooth
  flavor: love
  color: "#45072f"
  metabolisms:
    Bloodstream: &PomelustineMetabolism # Euphoria - Pill Compatibility Patch
      metabolismRate : 0.03
      effects:
      - !type:EvenHealthChange
        damage:
          Brute: -0.6
          Burn: -0.6
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages:
        - "reagent-effect-aphrodisiac-romantic-1"
        - "reagent-effect-aphrodisiac-romantic-2"
        - "reagent-effect-aphrodisiac-romantic-3"
        - "reagent-effect-aphrodisiac-romantic-4"
        - "reagent-effect-aphrodisiac-romantic-5"
        probability: 0.035
        conditions:
        - !type:ReagentCondition
          reagent: Romantacilin
          max: 50
        - !type:ConsentCondition
          consent: Aphrodisiacs
      - !type:PopupMessage # Overdose causes nausea and vomiting
        type: Local
        visualType: Medium
        messages:
        - "reagent-effect-aphrodisiac-romantic-overdose"
        probability: 0.06
        conditions:
        - !type:ReagentCondition
          reagent: Romantacilin
          min: 50
      - !type:Drunk
        conditions:
        - !type:ReagentCondition
          reagent: Romantacilin
          min: 50
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Romantacilin
          min: 60
        probability: 0.05
      - !type:PopupMessage
        type: Local
        visualType: Small
        messages:
        - "reagent-effect-aphrodisiac-fade" # A decent chance to notify the player when their meds run out, but could happen silently.
        probability: 0.35
        conditions:
        - !type:ReagentCondition
          reagent: Romantacilin
          max: 0.1
        - !type:ConsentCondition
          consent: Aphrodisiacs
    Digestion: *PomelustineMetabolism # Euphoria - Pill Compatibility Patch
